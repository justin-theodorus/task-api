services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container. Only the left number can clash with a Postgres already on your machine.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # The named volume is what makes data outlive the container. Delete the container and the
      # rows stay; delete this volume and they are gone.
      - pgdata:/var/lib/postgresql/data
      # Runs once, only when pgdata is empty.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # Not the .env value: inside the compose network the database answers to "db" on 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_HOST_PORT:-8001}:8000"
    depends_on:
      # Wait for the healthchecks, not just for the containers to exist, so the app does not
      # start talking to a database that is still booting.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
